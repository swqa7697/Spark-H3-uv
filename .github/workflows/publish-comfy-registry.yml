name: Publish Comfy Registry package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publishing tools
        run: python -m pip install comfy-cli==1.22.0 pytest ruff==0.17.0

      - name: Verify package builder and installer
        run: >-
          python -m pytest -q tests/test_comfyui_package.py
          -k "registry_package or installer_validates_runtime_and_package_platform"

      - name: Download v0.1.3 platform packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download comfyui-v0.1.3
          --repo "$GITHUB_REPOSITORY"
          --pattern "ComfyUI-Spark-H3-0.1.3-*.zip"
          --dir "$RUNNER_TEMP/platform-packages"

      - name: Collect all release wheels
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import zipfile

          source = Path(os.environ["RUNNER_TEMP"]) / "platform-packages"
          target = Path(os.environ["RUNNER_TEMP"]) / "registry-wheels"
          target.mkdir()
          for archive_path in sorted(source.glob("*.zip")):
              with zipfile.ZipFile(archive_path) as archive:
                  for name in archive.namelist():
                      if not name.endswith(".whl"):
                          continue
                      destination = target / Path(name).name
                      if destination.exists():
                          raise RuntimeError(f"duplicate wheel {destination.name}")
                      destination.write_bytes(archive.read(name))
          wheels = sorted(target.glob("*.whl"))
          if len(wheels) != 12:
              raise RuntimeError(f"expected 12 wheels, found {len(wheels)}")
          PY

      - name: Build the cross-platform Registry package
        run: >-
          python tools/build_comfyui_package.py
          --registry
          --version 0.1.3
          --publisher-id zechengtang
          --output-dir dist/registry
          --kernel-wheel-dir "$RUNNER_TEMP/registry-wheels"
          --no-zip

      - name: Prepare tracked package contents for comfy-cli
        working-directory: dist/registry/ComfyUI-Spark-H3
        run: |
          git init
          git config user.name "Spark-H3 Registry Publisher"
          git config user.email "noreply@users.noreply.github.com"
          git add --force .
          git commit -m "Prepare Comfy Registry package 0.1.3"

      - name: Validate Registry metadata and contents
        working-directory: dist/registry/ComfyUI-Spark-H3
        run: comfy node validate

      - name: Publish version 0.1.3
        working-directory: dist/registry/ComfyUI-Spark-H3
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          COMFY_NODE_CHANGELOG: >-
            Adds SM86 support, KJNodes low-VRAM compatibility, quick mode
            presets, and selectable dense warmup attention backends.
        run: comfy node publish --token "$REGISTRY_ACCESS_TOKEN"

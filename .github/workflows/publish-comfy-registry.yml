name: Publish Comfy Registry package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publishing tools
        run: python -m pip install comfy-cli==1.22.0 ruff==0.17.0

      - name: Verify publishing sources
        run: |
          python -m py_compile tools/build_comfyui_package.py comfyui/install.py
          ruff check --select E702 \
            h3_sparse_attention/landmark_v2_cosine_fast.py \
            h3_sparse_attention/landmark_v2_cosine_triton.py \
            h3_sparse_attention/reblock_hierarchy.py

      - name: Download v0.1.4 platform packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/platform-packages"
          gh release download comfyui-v0.1.4 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ComfyUI-Spark-H3-0.1.4-*.zip' \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/platform-packages"
          test "$(find "$RUNNER_TEMP/platform-packages" -maxdepth 1 -name '*.zip' | wc -l)" -eq 6
          cd "$RUNNER_TEMP/platform-packages"
          sha256sum --check SHA256SUMS.txt

      - name: Collect all release wheels
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import zipfile

          source = Path(os.environ["RUNNER_TEMP"]) / "platform-packages"
          target = Path(os.environ["RUNNER_TEMP"]) / "registry-wheels"
          target.mkdir()
          for archive_path in sorted(source.glob("*.zip")):
              with zipfile.ZipFile(archive_path) as archive:
                  if archive.testzip() is not None:
                      raise RuntimeError(f"corrupt ZIP: {archive_path}")
                  for name in archive.namelist():
                      if not name.endswith(".whl"):
                          continue
                      destination = target / Path(name).name
                      if destination.exists():
                          raise RuntimeError(f"duplicate wheel {destination.name}")
                      destination.write_bytes(archive.read(name))
          wheels = sorted(target.glob("*.whl"))
          if len(wheels) != 12:
              raise RuntimeError(f"expected 12 wheels, found {len(wheels)}")
          PY

      - name: Build the cross-platform Registry package
        run: >-
          python tools/build_comfyui_package.py
          --registry
          --version 0.1.6
          --publisher-id zechengtang
          --output-dir dist/registry
          --kernel-wheel-dir "$RUNNER_TEMP/registry-wheels"

      - name: Verify generated Registry package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tomllib

          package = Path("dist/registry/ComfyUI-Spark-H3")
          metadata = tomllib.loads((package / "pyproject.toml").read_text())
          identity = json.loads((package / "spark_h3_build.json").read_text())

          assert metadata["project"]["name"] == "comfyui-spark-h3"
          assert metadata["project"]["version"] == "0.1.6"
          assert metadata["project"]["requires-python"] == ">=3.12"
          assert metadata["tool"]["comfy"]["PublisherId"] == "zechengtang"
          assert identity["distribution"] == "registry"
          assert identity["architectures"] == ["sm120", "sm86", "sm89"]
          assert identity["platforms"] == ["linux-x86_64", "windows-x86_64"]
          assert len(list((package / "wheelhouse").glob("*.whl"))) == 12
          assert len(list((package / "workflows").glob("*.json"))) == 15
          PY
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path("dist/registry/ComfyUI-Spark-H3-0.1.6-registry.zip")
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
              assert "pyproject.toml" in bundle.namelist()
          PY
          sha256sum dist/registry/ComfyUI-Spark-H3-0.1.6-registry.zip

      - name: Prepare tracked package contents for comfy-cli
        working-directory: dist/registry/ComfyUI-Spark-H3
        run: |
          git init
          git config user.name "Spark-H3 Registry Publisher"
          git config user.email "noreply@users.noreply.github.com"
          git add --force .
          git commit -m "Prepare Comfy Registry package 0.1.6"

      - name: Validate Registry metadata and contents
        working-directory: dist/registry/ComfyUI-Spark-H3
        run: comfy node validate

      - name: Save production candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: spark-h3-registry-0.1.6-candidate
          path: dist/registry/ComfyUI-Spark-H3-0.1.6-registry.zip
          retention-days: 14

      - name: Confirm Registry version 0.1.6 is unused
        run: |
          python - <<'PY'
          import json
          import urllib.request
          url = "https://api.comfy.org/nodes/comfyui-spark-h3/versions"
          with urllib.request.urlopen(url, timeout=30) as response:
              versions = json.load(response)
          if any(item["version"] == "0.1.6" for item in versions):
              raise RuntimeError("Registry version 0.1.6 already exists")
          PY

      - name: Publish Registry version 0.1.6
        working-directory: dist/registry/ComfyUI-Spark-H3
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          COMFY_NODE_CHANGELOG: >-
            Registry package for Spark-H3 GitHub Release comfyui-v0.1.4. Adds
            ComfyUI 0.40.x support, sparse_scope target-video/joint-video for
            Ref2VA, in-node Ref2VA guidance, and configurable producer_chunk.
            Existing workflows retain their default behavior.
        run: comfy node publish --token "$REGISTRY_ACCESS_TOKEN"

      - name: Check Registry version record after publish attempt
        if: always()
        run: |
          python - <<'PY'
          import json
          import urllib.request
          url = "https://api.comfy.org/nodes/comfyui-spark-h3/versions"
          with urllib.request.urlopen(url, timeout=30) as response:
              versions = json.load(response)
          matching = [item for item in versions if item.get("version") == "0.1.6"]
          print(json.dumps(matching, indent=2))
          PY
